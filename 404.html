    /* Hallmark v2.0.0 | 404 page | signature: an editorial return to the workspace */
    /* Critique: keep the recovery action unmistakable and the page calm. */
    :root {
      color-scheme: light;
      --bg: #f6f5f1;
      --paper: #fffefa;
      --soft: #edf0e9;
      --ink: #242923;
      --muted: #687169;
      --green: #355947;
      --line: #d9ddd5;
      --content: 1320px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171d19;

      --muted: #afbbb1;
      --green: #a8cbb1;

    .site-header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-inner { width: min(calc(100% - 48px), var(--content)); height: 80px; margin: auto; display: flex; align-items: center; gap: 36px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 21px; font-weight: 750; letter-spacing: -.045em; white-space: nowrap; }
    .brand img { display: block; width: 34px; height: 34px; object-fit: contain; border-radius: 0; }
    .header-note { color: var(--muted); font-size: 13px; border-left: 1px solid var(--line); padding-left: 35px; }
    .header-nav { margin-left: auto; display: flex; gap: 26px; font-size: 13px; font-weight: 600; }
    .header-nav a:hover { color: var(--green); }
    .theme-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 8px 12px; cursor: pointer; font: 650 12px/1.5 var(--font); white-space: nowrap; }
    .theme-toggle:hover { background: var(--soft); }
    .theme-toggle:active { transform: translateY(1px); }
    .theme-symbol { font-size: 17px; line-height: 1; }
    main { min-height: calc(100svh - 160px); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 48px; padding-block: 64px; }
    .content { max-width: 690px; min-width: 0; }
    h1 { color: var(--green); font-size: clamp(46px, 6.6vw, 88px); font-weight: 680; letter-spacing: -.07em; line-height: 1.02; text-wrap: balance; overflow-wrap: break-word; margin: 0 0 24px; }
    .intro { color: var(--muted); font-size: clamp(16px, 1.6vw, 19px); max-width: 520px; margin: 0 0 32px; }
    .return-link { display: inline-flex; align-items: center; min-height: 52px; padding: 12px 24px; border: 1px solid var(--green); border-radius: 9px; background: var(--green); color: var(--paper); font-size: 14px; font-weight: 700; transition: transform .18s ease, opacity .18s ease; }
    .return-link:hover { opacity: .9; transform: translateY(-2px); }
    .return-link:active { transform: translateY(0); }
    .figure { align-self: stretch; display: grid; place-items: center; min-width: 280px; border-left: 1px solid var(--line); padding-left: 48px; color: var(--line); font-size: clamp(160px, 19vw, 290px); line-height: 1; font-weight: 750; letter-spacing: -.12em; font-variant-numeric: tabular-nums; user-select: none; }
    .site-footer { color: var(--ink); background: var(--paper); border-top: 1px solid var(--line); }
    .footer-inner { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; color: var(--muted); font-size: 12px; }
    .footer-inner a { color: var(--green); font-weight: 650; }
    .footer-inner a:hover { text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 1100px) { .header-note { display: none; } }
    @media (max-width: 700px) {
      .shell { width: min(calc(100% - 32px), 1200px); }
      .header-inner { width: min(calc(100% - 32px), var(--content)); height: 68px; }
      .header-nav { display: none; }
      .theme-toggle { margin-left: auto; }
      main { grid-template-columns: 1fr; min-height: calc(100svh - 148px); padding-block: 56px; }
      .figure { display: none; }
      .footer-inner { min-height: 80px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 4px; padding-block: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .return-link { transition: none; }
    }
  </style>
</head>

<script>
    const themeButton = document.querySelector('#theme-toggle');
    const themeLabel = document.querySelector('#theme-toggle-label');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    const currentTheme = () => document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
    function syncTheme() {
      const next = currentTheme() === 'dark' ? 'Light' : 'Dark';
      themeLabel.textContent = `${next} mode`;
      themeButton.setAttribute('aria-label', `Switch to ${next.toLowerCase()} mode`);
      document.querySelector('meta[name="theme-color"]').content = currentTheme() === 'dark' ? '#171d19' : '#f6f5f1';
    }
    themeButton.hidden = false;
    themeButton.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('calciverse-theme', next); } catch {}
      syncTheme();
    });
    systemTheme.addEventListener('change', () => { if (!document.documentElement.dataset.theme) syncTheme(); });
    syncTheme();
  </script>
